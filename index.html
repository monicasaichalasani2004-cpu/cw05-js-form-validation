<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CW-05 | Student Information Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-heading">
      <p class="course">CSC 6370 · Web Programming</p>
      <h1>Student Information</h1>
      <p>Enter the information below and click Add.</p>
    </header>

    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a student</h2>
      <p class="required-note">All three fields are required.</p>

      <form id="student-form" novalidate>
        <div id="error-summary" class="error-summary" role="alert" aria-live="assertive" hidden></div>

        <div class="field">
          <div id="id-error" class="field-error" aria-live="polite"></div>
          <label for="student-id">ID <span aria-hidden="true">*</span></label>
          <input id="student-id" name="studentId" type="text" inputmode="numeric" autocomplete="off" aria-describedby="id-error" required>
        </div>

        <div class="field">
          <div id="first-error" class="field-error" aria-live="polite"></div>
          <label for="first-name">First Name <span aria-hidden="true">*</span></label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" aria-describedby="first-error" required>
        </div>

        <div class="field">
          <div id="last-error" class="field-error" aria-live="polite"></div>
          <label for="last-name">Last Name <span aria-hidden="true">*</span></label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" aria-describedby="last-error" required>
        </div>

        <button type="submit">Add</button>
      </form>
    </section>

    <section id="result-section" class="result-section" aria-labelledby="result-heading" hidden>
      <h2 id="result-heading">Last added student</h2>
      <p id="success-message" class="success-message" role="status">Student information added successfully.</p>
      <dl class="result-list">
        <div><dt>UserID</dt><dd id="result-id"></dd></div>
        <div><dt>First Name</dt><dd id="result-first"></dd></div>
        <div><dt>Last Name</dt><dd id="result-last"></dd></div>
      </dl>
    </section>
    <footer>CW-05 · JavaScript Form Validation</footer>
  </main>
</body>
</html>
